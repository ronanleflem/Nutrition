<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition — Ajouter une photo</title>
  <!-- DESIGN.md: Photo prompt, Brand & Style -->
  <!-- EXPERIENCE.md: PhotoPrompt, Flow 6, Voice « Ajouter une photo ? » -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0d100d;
      display: flex;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }
    .phone {
      width: 390px;
      min-height: 844px;
      background: #1A1F1A;
      color: #F5F5F5;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
    }
    .body {
      flex: 1;
      padding: 48px 16px 24px;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #E8E0D4;
      line-height: 1.25;
    }
    .sub {
      margin-top: 8px;
      font-size: 16px;
      color: #B8C4B8;
      line-height: 1.5;
    }
    .ph {
      width: 120px;
      height: 120px;
      margin: 32px auto;
      border-radius: 10px;
      background: #2F372F;
      border: 1px solid #3A443A;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E8E0D4;
    }
    .actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      min-height: 44px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      width: 100%;
    }
    .btn-primary { background: #8FBC8F; color: #1A1F1A; }
    .btn-secondary { background: #242B24; color: #F5F5F5; border: 1px solid #3A443A; }
    .btn-ghost { background: transparent; color: #B8C4B8; font-weight: 400; }
  </style>
</head>
<body>
  <div class="phone">
    <main class="body">
      <h1>Ajouter une photo ?</h1>
      <p class="sub">Wrap poulet est enregistré. Vous pourrez en ajouter une plus tard.</p>
      <div class="ph" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6">
          <ellipse cx="20" cy="28" rx="12" ry="5"/>
          <path d="M10 28c2-10 8-14 10-14s8 4 10 14"/>
        </svg>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button">Galerie</button>
        <button class="btn btn-secondary" type="button">Caméra</button>
        <button class="btn btn-ghost" type="button">Plus tard</button>
      </div>
    </main>
  </div>
</body>
</html>
