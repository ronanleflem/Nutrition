<div class="shell" [class.shell--chrome-hidden]="shellChrome.hidden()">
  @if (!shellChrome.hidden()) {
    <header class="shell__header">
      <h1 class="shell__title">{{ pageTitle() }}</h1>
      <a
        class="shell__settings"
        routerLink="/settings"
        aria-label="Paramètres"
        title="Paramètres"
      >
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zM19.4 13a7.9 7.9 0 0 0 .1-2l2-1.5-2-3.5-2.3 1a8 8 0 0 0-1.7-1L15 3h-6l-.5 2.9a8 8 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a8 8 0 0 0 1.7 1L9 21h6l.5-2.9a8 8 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5z"
          />
        </svg>
      </a>
    </header>

    @if (!networkStatus.isOnline()) {
      <p class="shell__offline-banner" role="status">
        Mode hors ligne — navigation et données locales disponibles.
      </p>
    }
  }

  <main class="shell__content">
    <router-outlet />
  </main>

  @if (!shellChrome.hidden()) {
    <app-bottom-nav />
  }
</div>
