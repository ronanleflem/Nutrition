<nav class="bottom-nav" aria-label="Navigation principale">
  @for (item of items; track item.path) {
    <a
      class="bottom-nav__item"
      [routerLink]="item.path"
      routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="bottom-nav__icon" aria-hidden="true">
        @switch (item.icon) {
          @case ('pantry') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8zm2-3h12l1 2H5l1-2z"
              />
            </svg>
          }
          @case ('products') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M4 7h16v2H4V7zm0 4h10v2H4v-2zm0 4h16v2H4v-2zM16 11h4v2h-4v-2z"
              />
            </svg>
          }
          @case ('recipes') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm1 4v2h10V8H7zm0 4v2h6v-2H7z"
              />
            </svg>
          }
          @case ('plan') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M7 3h2v2h6V3h2v2h3v16H4V5h3V3zm-1 6v10h12V9H6zm2 2h2v2H8v-2zm4 0h2v2h-2v-2zm-4 4h2v2H8v-2zm4 0h2v2h-2v-2z"
              />
            </svg>
          }
          @case ('shopping') {
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M7 4h-2l-1 2H3v2h1l2 10h12l2-10h1V6h-1l-1-2h-2l-1 10H8L7 4zm3 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"
              />
            </svg>
          }
        }
      </span>
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }
</nav>
