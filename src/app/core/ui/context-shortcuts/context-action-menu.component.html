<div
  class="sheet-backdrop"
  data-backdrop="true"
  (click)="onBackdropClick($event)"
  role="presentation"
>
  <section
    class="sheet"
    role="dialog"
    aria-modal="true"
    aria-label="Actions"
    [attr.aria-busy]="busy() ? true : null"
    (click)="$event.stopPropagation()"
  >
    <header class="sheet__header">
      <h2 class="sheet__title">{{ title() }}</h2>
      <button type="button" class="sheet__close" aria-label="Fermer" (click)="closed.emit()">
        ×
      </button>
    </header>

    <ul class="sheet__list">
      <li>
        <button type="button" class="sheet__list-button" [disabled]="busy()" (click)="choose('pantry')">
          {{ labels.pantry }}
        </button>
      </li>
      @if (showUseInRecipe()) {
        <li>
          <button
            type="button"
            class="sheet__list-button"
            [disabled]="busy()"
            (click)="choose('use-in-recipe')"
          >
            {{ labels.useInRecipe }}
          </button>
        </li>
      }
      <li>
        <button type="button" class="sheet__list-button" [disabled]="busy()" (click)="choose('shopping')">
          {{ labels.shopping }}
        </button>
      </li>
    </ul>
  </section>
</div>
