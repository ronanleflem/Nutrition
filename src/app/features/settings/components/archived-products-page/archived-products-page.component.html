<section class="archived-products-page">
  <header class="archived-products-page__header">
    <a class="archived-products-page__back" routerLink="/settings">← Paramètres</a>
    <h1 class="archived-products-page__title">Produits archivés</h1>
  </header>

  @if (loading()) {
    <p class="archived-products-page__status" role="status">Chargement…</p>
  } @else if (products().length === 0) {
    <p class="archived-products-page__empty">Aucun produit archivé.</p>
  } @else {
    <ul class="archived-products-page__list">
      @for (product of products(); track product.id) {
        <li class="archived-products-page__item">
          <div class="archived-products-page__info">
            <span class="archived-products-page__name">{{ product.name }}</span>
            @if (product.category) {
              <span class="archived-products-page__category">{{ product.category }}</span>
            }
          </div>
          <button
            class="archived-products-page__restore"
            type="button"
            [disabled]="restoringId() === product.id"
            (click)="restoreProduct(product.id)"
          >
            {{ restoringId() === product.id ? 'Restauration…' : 'Restaurer' }}
          </button>
        </li>
      }
    </ul>
  }
</section>
