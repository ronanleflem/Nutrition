<section class="recipes-page">
  <app-surface-banner variant="recipes" />

  @if (loading()) {
    <p class="recipes-page__status" role="status">Chargement…</p>
  } @else if (!hasRecipes()) {
    <app-empty-state variant="recipes" />
  } @else {
    <ul class="recipes-page__list" aria-label="Recettes">
      @for (item of recipes(); track item.recipe.id) {
        <li>
          <article class="recipe-card" appLongPress (appLongPress)="openShortcut(item, true)">
            <a class="recipe-card__link" [routerLink]="['/recipes', item.recipe.id]">
              <app-recipe-photo-thumb
                class="recipe-card__thumb"
                size="list"
                [photoBlobId]="item.recipe.photoBlobId"
              />
              <span class="recipe-card__text">
                <span class="recipe-card__title">{{ item.recipe.title }}</span>
                <span class="recipe-card__subtitle">{{ item.defaultVariantName }}</span>
              </span>
            </a>
            <button
              type="button"
              class="recipe-card__menu"
              aria-haspopup="menu"
              aria-label="Actions"
              (pointerdown)="$event.stopPropagation()"
              (click)="onMenuClick($event, item)"
            >
              ⋮
            </button>
          </article>
        </li>
      }
    </ul>
  }

  <a class="recipes-page__fab" routerLink="/recipes/new" aria-label="Créer une recette">+</a>
</section>

<app-context-shortcuts-outlet />
